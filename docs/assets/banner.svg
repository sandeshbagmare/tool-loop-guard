<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="tool-loop-guard: catch an agent repeating itself while it is still cheap">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(204 68% 12%)">
        <animate attributeName="stop-color" values="hsl(204 68% 12%);hsl(204 62% 20%);hsl(204 68% 12%)" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="hsl(204 62% 20%)">
        <animate attributeName="stop-color" values="hsl(204 62% 20%);hsl(204 68% 12%);hsl(204 62% 20%)" dur="14s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.28" r="0.62">
      <stop offset="0" stop-color="hsl(258 88% 66%)" stop-opacity="0.34"/>
      <stop offset="1" stop-color="hsl(258 88% 66%)" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="hsl(204 40% 40%)" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="0" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <g transform="translate(880, -10)">
