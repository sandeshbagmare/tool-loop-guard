s"/></circle><circle cx="210" cy="160" r="10" fill="none" stroke="hsl(258 88% 66%)" stroke-width="2"><animate attributeName="r" values="10;74" dur="3s" repeatCount="indefinite" begin="-2.25s"/><animate attributeName="opacity" values="0.8;0" dur="3s" repeatCount="indefinite" begin="-2.25s"/></circle><circle cx="110" cy="160" r="7" fill="hsl(258 92% 78%)"/><circle cx="210" cy="160" r="7" fill="hsl(258 92% 78%)"/>
