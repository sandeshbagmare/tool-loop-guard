  <text x="62" y="146" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="60" font-weight="800" fill="#f8fafc">tool-loop-guard</text>
  <text x="64" y="192" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" fill="#cbd5e1">catch an agent repeating itself while it is still cheap</text>
