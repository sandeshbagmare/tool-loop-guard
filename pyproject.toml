[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tool-loop-guard"
version = "0.1.0"
description = "Detect an agent repeating or cycling tool calls before it burns its context window"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sandesh Bagmare" }]
keywords = ["agents", "llm", "tool-calls", "loop-detection", "langgraph", "guardrail"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sandeshbagmare/tool-loop-guard"
Issues = "https://github.com/sandeshbagmare/tool-loop-guard/issues"
Changelog = "https://github.com/sandeshbagmare/tool-loop-guard/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/tool_loop_guard"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-q --doctest-modules"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
